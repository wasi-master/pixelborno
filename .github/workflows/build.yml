name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the font
        run: python3 tools/build.py

      - name: Check it
        run: python3 tools/check.py

      - name: Render the specimens
        run: python3 tools/specimen.py

      - uses: actions/upload-artifact@v4
        with:
          name: pixelborno
          path: |
            dist/Pixelborno-Regular.ttf
            specimens/*.png
